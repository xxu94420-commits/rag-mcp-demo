name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Smoke test CLI (ingest + ask)
        run: |
          python -m rag_mcp_demo.cli ingest sample_docs
          python -m rag_mcp_demo.cli ask "MCP 服务器暴露哪三类原语？"
